<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Landscape Flight</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
    }
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
    #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        color: rgba(255, 255, 255, 0.8);
        font: 13px/1.4 monospace;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
    }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud" style="display: none;">Flying over randomly generated terrain &mdash; R regenerate &middot; G edges &middot; 1/2 hills &middot; 3/4 height &middot; 5/6 trees &middot; &larr;/&rarr;/&uarr;/&darr; pivot &middot; M toggle this text</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
