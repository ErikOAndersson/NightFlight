<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Landscape Flight</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
    }
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
    #help {
        position: fixed;
        top: 10px;
        left: 12px;
        margin: 0;
        padding: 10px 14px;
        list-style: none;
        color: rgba(255, 255, 255, 0.85);
        font: 13px/1.6 monospace;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        background: rgba(0, 0, 0, 0.35);
        border-radius: 6px;
        pointer-events: none;
    }
    #help b {
        display: inline-block;
        min-width: 56px;
        color: #fff;
    }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<ul id="help" style="display: none;">
    <li><b>M</b> toggle this help</li>
    <li><b>R</b> regenerate world</li>
    <li><b>G</b> wireframe edges</li>
    <li><b>C</b> toggle auto-camera</li>
    <li><b>1 / 2</b> fewer / more hills</li>
    <li><b>3 / 4</b> lower / raise height</li>
    <li><b>5 / 6</b> fewer / more trees</li>
    <li><b>&larr; &rarr; &uarr; &darr;</b> pivot camera</li>
</ul>
<script type="module" src="./src/main.js"></script>
</body>
</html>
